<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Shravan Patel - a cat chases a glowing purple orb while a developer codes" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <radialGradient id="bg" cx="50%" cy="0%" r="110%">
      <stop offset="0" stop-color="#17102b"/>
      <stop offset="0.6" stop-color="#07060c"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#eadfff"/>
      <stop offset="0.65" stop-color="#b99cff"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="orbGlow">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbCore">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#5433c4"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <rect width="900" height="400" rx="22" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="898.5" height="398.5" rx="22" fill="none" stroke="#2a2145" stroke-width="1.5"/>

  <!-- twinkling stars -->
  <g fill="#d9ccff">
    <circle cx="40" cy="40" r="1.2"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="260" r="0.9"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="30" r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="215" r="1.1"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="45" r="0.8"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="250" r="1.2"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="70" r="0.9"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="230" r="1"><animate attributeName="opacity" values="1;0.3;1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="60" r="1.2"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="870" cy="200" r="0.8"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="80" cy="150" r="0.9"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="160" r="0.8"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.9s" repeatCount="indefinite"/></circle>
  </g>

  <!-- floating triangle mesh (top right) -->
  <g stroke="#a78bfa" stroke-opacity="0.25" stroke-width="1" fill="none">
    <path d="M720 50 L690 100 L750 100 Z M690 100 L660 150 L720 150 Z M750 100 L720 150 L780 150 Z M660 150 L630 200 L690 200 Z M720 150 L690 200 L750 200 Z M780 150 L750 200 L810 200 Z"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 5;0 0" dur="6s" repeatCount="indefinite"/>
  </g>
  <g fill="#efe7ff">
    <circle cx="720" cy="50" r="2.2"/><circle cx="690" cy="100" r="2.2"/><circle cx="750" cy="100" r="2.2"/>
    <circle cx="660" cy="150" r="2.2"/><circle cx="720" cy="150" r="2.2"/><circle cx="780" cy="150" r="2.2"/>
    <circle cx="630" cy="200" r="2.2"/><circle cx="690" cy="200" r="2.2"/><circle cx="750" cy="200" r="2.2"/><circle cx="810" cy="200" r="2.2"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 5;0 0" dur="6s" repeatCount="indefinite"/>
  </g>

  <!-- title -->
  <g font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">
    <text x="48" y="108" font-size="82" letter-spacing="-3" fill="#8b5cf6" opacity="0.4" filter="url(#blur)">SHRAVAN</text>
    <text x="48" y="108" font-size="82" letter-spacing="-3" fill="url(#name)">SHRAVAN
      <animate attributeName="opacity" values="0;1" dur="1.4s" fill="freeze"/>
    </text>
    <text x="48" y="184" font-size="82" letter-spacing="-3" fill="url(#name)">PATEL
      <animate attributeName="opacity" values="0;1" dur="1.8s" fill="freeze"/>
    </text>
    <text x="52" y="216" font-size="17" font-weight="400" fill="#9188b3">building cool things, one commit at a time.</text>
  </g>

  <!-- floor -->
  <ellipse cx="450" cy="348" rx="410" ry="14" fill="#8b5cf6" fill-opacity="0.10"/>
  <line x1="0" y1="346" x2="900" y2="346" stroke="#a78bfa" stroke-opacity="0.25"/>

  <!-- developer -->
  <g transform="translate(110 346)">
    <ellipse cx="0" cy="-10" rx="40" ry="12" fill="#2a2145"/>
    <!-- laptop -->
    <rect x="-86" y="-46" width="34" height="28" rx="3" fill="#1b1433" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="-69" y="-28" font-size="11" font-weight="700" fill="#c4b5fd" text-anchor="middle" font-family="monospace">&lt;/&gt;</text>
    <rect x="-90" y="-18" width="42" height="4" fill="#3b2b6e"/>
    <!-- body -->
    <ellipse cx="0" cy="-42" rx="25" ry="32" fill="url(#body)"/>
    <!-- arms -->
    <g stroke="#7c4dff" stroke-width="10" stroke-linecap="round" fill="none">
      <path d="M-14 -60 L-42 -30"/>
      <path d="M14 -60 L34 -24"/>
    </g>
    <circle cx="-44" cy="-29" r="5.5" fill="#f6d9c8"/>
    <circle cx="34" cy="-24" r="5.5" fill="#f6d9c8"/>
    <!-- head group (gentle bob) -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="3s" repeatCount="indefinite"/>
      <ellipse cx="-22" cy="-84" rx="5" ry="12" fill="#1a1330"/>
      <ellipse cx="22" cy="-84" rx="5" ry="12" fill="#1a1330"/>
      <ellipse cx="0" cy="-92" rx="23" ry="24" fill="#f6d9c8"/>
      <path d="M-25 -96 A25 25 0 0 1 25 -96 Z" fill="#1a1330"/>
      <path d="M-22 -96 L-14 -82 L-6 -96 Z M-6 -96 L2 -80 L10 -96 Z M8 -96 L20 -86 L24 -96 Z" fill="#1a1330"/>
      <path d="M10 -116 L16 -90" stroke="#c4b5fd" stroke-width="3" fill="none"/>
      <!-- headphones -->
      <path d="M-27 -94 A27 27 0 0 1 27 -94" stroke="#a78bfa" stroke-width="4" fill="none"/>
      <rect x="-31" y="-93" width="8" height="16" rx="4" fill="#a78bfa"/>
      <rect x="23" y="-93" width="8" height="16" rx="4" fill="#a78bfa"/>
      <!-- eyes -->
      <g>
        <ellipse cx="-9" cy="-87" rx="6" ry="7.5" fill="#fff"/><ellipse cx="9" cy="-87" rx="6" ry="7.5" fill="#fff"/>
        <ellipse cx="-7" cy="-86" rx="4.4" ry="5.4" fill="#7c3aed"/><ellipse cx="11" cy="-86" rx="4.4" ry="5.4" fill="#7c3aed"/>
        <ellipse cx="-7" cy="-86" rx="2" ry="2.6" fill="#1a1330"/><ellipse cx="11" cy="-86" rx="2" ry="2.6" fill="#1a1330"/>
        <circle cx="-5.6" cy="-88" r="1.3" fill="#fff"/><circle cx="12.4" cy="-88" r="1.3" fill="#fff"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;5 1;0 0;-2 0;0 0" dur="10s" repeatCount="indefinite"/>
      </g>
      <ellipse cx="-14" cy="-78" rx="4.5" ry="2.6" fill="#ff8fb8" opacity="0.4"/>
      <ellipse cx="14" cy="-78" rx="4.5" ry="2.6" fill="#ff8fb8" opacity="0.4"/>
      <path d="M-3.4 -79 Q0 -75 3.4 -79" stroke="#8a4b5b" stroke-width="1.6" fill="none"/>
    </g>
  </g>

  <!-- orb + trail -->
  <g id="orb">
    <circle r="38" fill="url(#orbGlow)">
      <animate attributeName="cx" values="520;800;430;700;520" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="290;220;300;250;290" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle r="9" fill="url(#orbCore)">
      <animate attributeName="cx" values="520;800;430;700;520" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="290;220;300;250;290" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="r" values="9;10.5;9" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- cat chasing the orb -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="520 346;800 346;430 346;700 346;520 346" dur="10s" begin="0.5s" calcMode="spline" keyTimes="0;0.25;0.5;0.75;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1" repeatCount="indefinite"/>
    <ellipse cx="0" cy="2" rx="34" ry="5" fill="#000" opacity="0.35"/>
    <!-- tail -->
    <path d="M-22 -16 Q-48 -22 -42 -50" stroke="#e6dcfb" stroke-width="7" stroke-linecap="round" fill="none">
      <animate attributeName="d" values="M-22 -16 Q-48 -22 -42 -50;M-22 -16 Q-48 -14 -38 -42;M-22 -16 Q-48 -22 -42 -50" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <!-- legs -->
    <g stroke="#b79be8" stroke-width="7" stroke-linecap="round">
      <path d="M-14 -12 L-14 -3"/><path d="M-6 -12 L-6 -3"/><path d="M10 -12 L10 -3"/><path d="M18 -12 L18 -3"/>
    </g>
    <ellipse cx="0" cy="-20" rx="26" ry="15" fill="#e6dcfb"/>
    <!-- head -->
    <ellipse cx="26" cy="-34" rx="15" ry="13.5" fill="#e6dcfb"/>
    <path d="M23 -40 L27 -59 L35 -43 Z M33 -40 L37 -59 L45 -43 Z" fill="#e6dcfb"/>
    <path d="M27 -43 L28 -54 L33 -44 Z M37 -43 L38 -54 L43 -44 Z" fill="#b79be8"/>
    <ellipse cx="27" cy="-35" rx="3.6" ry="4.1" fill="#fff"/><ellipse cx="36" cy="-35" rx="3.6" ry="4.1" fill="#fff"/>
    <ellipse cx="28.5" cy="-34.5" rx="2.2" ry="3" fill="#2a1f4d"/><ellipse cx="37.5" cy="-34.5" rx="2.2" ry="3" fill="#2a1f4d"/>
    <ellipse cx="32" cy="-30" rx="2" ry="1.4" fill="#ff9ec4"/>
    <g stroke="#2a1f4d" stroke-opacity="0.6" stroke-width="1">
      <path d="M37 -30 L48 -32 M37 -28 L47 -25 M27 -30 L16 -32 M27 -28 L17 -25"/>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
