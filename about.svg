<rect x="360" y="66" width="180" height="2" rx="1" fill="url(#bar)"><animate attributeName="x" values="300;420;300" dur="5s" repeatCount="indefinite"/></rect><text x="450" y="102" font-size="18" text-anchor="middle" fill="#f1ecff">Hey, I'm <tspan font-weight="700" fill="#c4b5fd">Shravan Patel</tspan> — a developer who loves building cool things</text><text x="450" y="126" font-size="18" text-anchor="middle" fill="#9188b3">and contributing to open source.</text><g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.15s" fill="freeze"/><circle cx="70" cy="165" r="14" fill="url(#glow)"><animate attributeName="r" values="10;16;10" dur="3s" repeatCount="indefinite"/></circle><circle cx="70" cy="165" r="4.5" fill="#c4b5fd"/><text x="92" y="170" font-size="17" font-weight="700" fill="#f1ecff">GSSoC'26 contributor</text><text x="92" y="189" font-size="13" fill="#9188b3">participant #536</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.3s" fill="freeze"/><circle cx="470" cy="165" r="14" fill="url(#glow)"><animate attributeName="r" values="10;16;10" dur="3s" repeatCount="indefinite"/></circle><circle cx="470" cy="165" r="4.5" fill="#c4b5fd"/><text x="492" y="170" font-size="17" font-weight="700" fill="#f1ecff">Ranked in the top 2%</text><text x="492" y="189" font-size="13" fill="#9188b3">open source impact</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.44999999999999996s" fill="freeze"/><circle cx="70" cy="213" r="14" fill="url(#glow)"><animate attributeName="r" values="10;16;10" dur="3s" repeatCount="indefinite"/></circle><circle cx="70" cy="213" r="4.5" fill="#c4b5fd"/><text x="92" y="218" font-size="17" font-weight="700" fill="#f1ecff">42 pull requests</text><text x="92" y="237" font-size="13" fill="#9188b3">merged and counting</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.6s" fill="freeze"/><circle cx="470" cy="213" r="14" fill="url(#glow)"><animate attributeName="r" values="10;16;10" dur="3s" repeatCount="indefinite"/></circle><circle cx="470" cy="213" r="4.5" fill="#c4b5fd"/><text x="492" y="218" font-size="17" font-weight="700" fill="#f1ecff">Debugging is better</text><text x="492" y="237" font-size="13" fill="#9188b3">with a cat nearby</text></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>